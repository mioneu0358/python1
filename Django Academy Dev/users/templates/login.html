<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 - DevLab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans KR', sans-serif; }</style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200/80 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-900">DevLab 로그인</h1>
            <p class="text-sm text-slate-500 mt-2">등록된 이메일과 비밀번호를 입력해주세요.</p>
        </div>

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            
            {% if form.errors %}
            <div class="text-sm text-red-600 bg-red-50 p-3 rounded-xl">
                이메일이나 비밀번호가 올바르지 않습니다.
            </div>
            {% endif %}

            <!-- Django form 렌더링 시 Tailwind 스타일을 먹이기 위해 수동 배치 -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">이메일</label>
                <input type="email" name="username" class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">비밀번호</label>
                <input type="password" name="password" class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-2.5 rounded-xl hover:bg-indigo-700 transition">
                로그인
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-slate-500">
            아직 계정이 없으신가요? <a href="{% url 'users:signup' %}" class="text-indigo-600 font-medium hover:underline">회원가입</a>
        </div>
        <div class="mt-2 text-center text-sm text-slate-500">
            <a href="/" class="hover:underline">← 메인으로 돌아가기</a>
        </div>
    </div>
</body>
</html>
