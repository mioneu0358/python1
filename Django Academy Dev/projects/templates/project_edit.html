<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 수정 - DevLab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .CodeMirror { height: auto; min-height: 150px; font-family: 'D2Coding', 'Consolas', monospace; font-size: 14px; border-radius: 0.5rem; padding: 10px 0; }
        .drag-over { border: 2px dashed #4f46e5 !important; background-color: #e0e7ff !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-20">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="font-bold text-xl text-slate-900">📝 프로젝트 수정</h1>
            <div class="flex gap-2">
                <a href="{% url 'projects:detail' project.pk %}" class="px-5 py-2 bg-slate-100 text-slate-700 text-sm font-bold rounded-xl hover:bg-slate-200 transition">취소</a>
                <button id="saveProjectBtn" class="px-5 py-2 bg-indigo-600 text-white text-sm font-bold rounded-xl hover:bg-indigo-700 transition shadow-sm">
                    수정 완료
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <!-- 기존 제목 및 반 정보 세팅 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">프로젝트 명</label>
                    <input type="text" id="projectTitle" value="{{ project.title }}" class="w-full px-4 py-3 border border-slate-300 rounded-xl text-lg font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">소속 반 (선택)</label>
                    <select id="projectClass" class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                        <option value="">개인 프로젝트 (선택 안함)</option>
                        {% for c in classes %}
                            <option value="{{ c.id }}" {% if project.study_class_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <div id="blocksContainer" class="space-y-4">
            <!-- 자바스크립트로 기존 블록들이 그려질 영역 -->
        </div>

        <div class="mt-6 flex justify-center gap-4">
            <button onclick="addBlock('markdown')" class="px-4 py-2 border-2 border-dashed border-slate-300 text-slate-500 font-bold rounded-xl hover:border-indigo-400 hover:text-indigo-600 transition flex items-center gap-2">
                <span>+</span> Markdown 추가
            </button>
            <button onclick="addBlock('code')" class="px-4 py-2 border-2 border-dashed border-slate-300 text-slate-500 font-bold rounded-xl hover:border-slate-800 hover:text-slate-900 transition flex items-center gap-2">
                <span class="font-mono">{ }</span> Code 추가
            </button>
        </div>
    </main>

    <!-- CSRF Token -->
    <meta name="csrf-token" content="{{ csrf_token }}">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>

    <script>
        const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
        
        // 💡 백엔드에서 넘겨준 기존 블록 데이터를 가져옵니다. (안전하게 JSON 파싱)
        const existingBlocks = {{ blocks_json|safe }};

        document.addEventListener('DOMContentLoaded', () => {
            // 화면 로딩 시 기존 블록들을 순서대로 그려줌
            if (existingBlocks.length > 0) {
                existingBlocks.forEach(block => {
                    addBlock(block.type, block.content);
                });
            } else {
                addBlock('markdown'); // 빈 프로젝트일 경우 하나 추가
            }
        });

        // 1. 블록 추가 함수 (content 파라미터가 있으면 내용을 채워넣습니다)
        function addBlock(type, initialContent = '') {
            const container = document.getElementById('blocksContainer');
            const blockId = 'block-' + Date.now() + Math.floor(Math.random() * 1000);
            
            const badge = type === 'markdown' 
                ? '<span class="text-xs font-bold px-2 py-1 bg-slate-100 text-slate-600 rounded-lg">M Markdown</span>'
                : '<span class="text-xs font-bold px-2 py-1 bg-slate-800 text-green-400 rounded-lg font-mono">Code</span>';
                
            const blockHTML = `
                <div class="block-item relative bg-white rounded-2xl shadow-sm border border-slate-200 p-4 transition-all" data-type="${type}" id="wrapper-${blockId}">
                    <div class="flex justify-between items-center mb-2">
                        ${badge}
                        <div class="flex gap-2">
                            ${type === 'code' ? `
                                <select class="text-xs border rounded px-1" onchange="changeLanguage('${blockId}', this.value)">
                                    <option value="python">Python</option>
                                    <option value="text/x-c++src">C++</option>
                                </select>
                            ` : ''}
                            <button onclick="document.getElementById('wrapper-${blockId}').remove()" class="text-slate-400 hover:text-red-500 transition text-sm">삭제</button>
                        </div>
                    </div>
                    <textarea id="${blockId}" class="block-content w-full px-3 py-3 rounded-lg border border-slate-200 focus:outline-none"></textarea>
                </div>
            `;
            
            container.insertAdjacentHTML('beforeend', blockHTML);
            const textarea = document.getElementById(blockId);
            
            // 기존 내용이 있다면 텍스트 영역에 세팅
            textarea.value = initialContent;

            if (type === 'code') {
                const editor = CodeMirror.fromTextArea(textarea, {
                    mode: 'python',
                    theme: 'dracula',
                    lineNumbers: true,
                    indentUnit: 4,
                    viewportMargin: Infinity
                });
                textarea.codeMirrorEditor = editor; 
            } else if (type === 'markdown') {
                attachImageUploadEvent(textarea); // 앞서 만든 이미지 업로드 로직 재사용
            }
        }

        // 언어 변경 함수
        function changeLanguage(blockId, lang) {
            const textarea = document.getElementById(blockId);
            if(textarea && textarea.codeMirrorEditor) {
                textarea.codeMirrorEditor.setOption("mode", lang);
            }
        }

        // 이미지 드래그 앤 드롭 로직 (생성 페이지와 동일)
        function attachImageUploadEvent(textarea) {
            textarea.addEventListener('dragover', (e) => { e.preventDefault(); textarea.classList.add('drag-over'); });
            textarea.addEventListener('dragleave', () => textarea.classList.remove('drag-over'));
            textarea.addEventListener('drop', async (e) => {
                e.preventDefault(); textarea.classList.remove('drag-over');
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) await uploadImage(file, textarea);
            });
            textarea.addEventListener('paste', async (e) => {
                const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                for (let item of items) {
                    if (item.type.indexOf('image') !== -1) {
                        e.preventDefault();
                        const file = item.getAsFile();
                        await uploadImage(file, textarea);
                    }
                }
            });
        }

        async function uploadImage(file, textarea) {
            const cursorPos = textarea.selectionStart;
            const textBefore = textarea.value.substring(0, cursorPos);
            const textAfter = textarea.value.substring(textarea.selectionEnd);
            const placeholder = `\n![업로드 중...]()\n`;
            textarea.value = textBefore + placeholder + textAfter;

            const formData = new FormData();
            formData.append('image', file);
            try {
                const response = await fetch('/projects/upload-image/', {
                    method: 'POST', headers: { 'X-CSRFToken': csrfToken }, body: formData
                });
                const data = await response.json();
                if (data.url) textarea.value = textarea.value.replace(placeholder, `\n![image](${data.url})\n`);
                else textarea.value = textarea.value.replace(placeholder, '');
            } catch (error) {
                textarea.value = textarea.value.replace(placeholder, '');
            }
        }

        // 저장(수정) 버튼 로직
        document.getElementById('saveProjectBtn').addEventListener('click', function() {
            const title = document.getElementById('projectTitle').value;
            const classId = document.getElementById('projectClass').value;
            
            if (!title) return alert('프로젝트 명을 입력해주세요.');

            const blocksData = [];
            document.querySelectorAll('.block-item').forEach(el => {
                const type = el.getAttribute('data-type');
                const textarea = el.querySelector('.block-content');
                let content = type === 'code' ? textarea.codeMirrorEditor.getValue() : textarea.value;
                blocksData.push({ type: type, content: content });
            });

            // 현재 프로젝트 URL(edit)로 POST 요청
            fetch('', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify({ title: title, class_id: classId, blocks: blocksData })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') window.location.href = data.redirect_url;
                else alert('저장 실패: ' + (data.msg || '알 수 없는 오류'));
            });
        });
    </script>
</body>
</html>
